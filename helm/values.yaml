app:
  # Short project name so generated resource names stay within k8s limits.
  fullnameOverride: "gaatha"
  environment: PROD
  # Global image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  api:
    enabled: true
    containerPort: 80
    command: ["/code/scripts/run_prod.sh"]
    probes:
      enabled: true    # chart defaults: liveness /healthz/live/, readiness+startup /healthz/ready/
    ingress:
      enabled: true
      # NOTE: className left blank on purpose; body-size + ingress class are set in
      # values/traefik.yaml. Set `host` per environment in the env overlay.
      className:
      host:
    resources:
      requests:
        cpu: "0.1"
        memory: 0.5Gi
      limits:
        cpu: "1"
        memory: 1Gi

  # This project has no Celery workers.
  worker:
    enabled: false

  hooks:
    enabled: true
    jobs:
      # NOTE: Make sure keys are lowercase.
      # db-migrate and collect-static inherit the chart defaults (manage.py migrate /
      # collectstatic --noinput). wait-for-resources gates the app on DB + object
      # storage connectivity.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--minio"]

  # NOTE: Check gaatha/settings.py for all available options. Per-environment values
  # (domains, cookie domains, S3 endpoint/buckets) and all secrets are supplied by the
  # env overlays + CICD at deploy time.
  env:
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DEBUG: "false"
    LANGUAGE_CODE: "en-us"
    TIME_ZONE: "Asia/Kathmandu"
    # Object storage on by default; endpoint, bucket names and credentials are
    # supplied per-environment (deployer's choice) — see gaatha/settings.py.
    AWS_S3_ENABLED: "true"
    # AWS_S3_ENDPOINT_URL: ""        # per-environment (deploy time)
    # AWS_S3_MEDIA_BUCKET_NAME: ""   # per-environment (deploy time)
    # AWS_S3_STATIC_BUCKET_NAME: ""  # per-environment (deploy time)
