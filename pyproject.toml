[project]
name = "gaatha"
version = "0.1.0"  # managed by release.sh
description = ""
authors = [
    {name = "TC-DEV", email = "dev@togglecorp.com"},
]
requires-python = "~=3.11"
dependencies = [
   "Django<5.0.0,>=4.1.5",
   "django-environ>=0.9.0",
   "psycopg2<3.0.0,>=2.9.5",
   "pillow",
   "strawberry-graphql==0.151.2",
   "strawberry-graphql-django==0.8.2",
   "starlette<1.0.0,>=0.23.1",
   "django-tinymce<4.0.0,>=3.5.0",
   "pytest-django<5.0.0,>=4.5.2",
   "factory-boy<4.0.0,>=3.2.1",
   "redis>=6.3.0",
   "gunicorn>=23.0.0",
   "requests>=2.32.4",
   "django-storages[s3]>=1.14.6",
   # 3.24.0 is the newest release compatible with Django 4.2; 4.x requires Django>=5.2.
   "django-health-check==3.24.0",
   "psutil>=7.2.0",
   "banjo-utils",
]

[tool.uv.sources]
banjo-utils = { git = "https://github.com/toggle-corp/banjo-utils", tag = "v0.2.0" }

[dependency-groups]
dev = []
[tool.uv]
package = false

[tool.ruff]
line-length = 130
extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "**/migrations/*",
    "__pycache__",
    "uv.lock",
]
# Preserve the existing quote style to keep the migration diff minimal.
format.quote-style = "preserve"

[tool.ruff.lint]
ignore = ["C901", "E203", "E701"]
extend-select = ["I", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
