name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - project/*
    tags:
      - "v*.*.*"

permissions:
  # contents: write lets the tag-triggered release job create the GitHub Release.
  contents: write
  packages: write
  pull-requests: read

jobs:
  _:
    uses: toggle-corp/banjo-action/.github/workflows/pipeline.yml@v0.3.0
    permissions:
      contents: write
      packages: write
      pull-requests: read
    with:
      # -- Same as CI (./ci.yml)
      # Job: Pre-commit
      pre_commit__apt_packages: "libpq-dev"
      # Job: Docker
      docker__wait_cmd: "./manage.py wait_for_resources --db"
      docker__migration_dummy_test: "gaatha.tests.FakeTest"
      docker__run_graphql_check: true
      docker__compose_file: "docker-compose.yml:.github/docker-compose.yml"
      docker__compose_service_name: "server"
      docker__compose_test_cmd: "/code/scripts/run_tests.sh"
      # Job: Helm
      helm__chart_directory: "./helm"
      # -- Publish
      docker__push: true
      helm__push: true
      # Create a GitHub Release when the trigger is a version tag (v*.*.*).
      github_release__create: ${{ github.ref_type == 'tag' }}
