name: CI

on:
  pull_request:
  # NOTE: For push/publish, see ./publish-helm.yml

jobs:
  _:
    uses: toggle-corp/banjo-action/.github/workflows/pipeline.yml@v0.3.0
    permissions:
      contents: read
      packages: write
      pull-requests: read
    with:
      # Job: Pre-commit — libpq headers so `uv sync` can build psycopg2 on the runner
      pre_commit__apt_packages: "libpq-dev"
      # Job: Docker
      docker__wait_cmd: "./manage.py wait_for_resources --db"
      docker__migration_dummy_test: "gaatha.tests.FakeTest"
      docker__run_graphql_check: true
      docker__compose_file: "docker-compose.yml:.github/docker-compose.yml"
      docker__compose_service_name: "server"
      docker__compose_test_cmd: "/code/scripts/run_tests.sh"
      # Job: Helm
      helm__chart_directory: "./helm"
